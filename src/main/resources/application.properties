jdbc.driver=${JDBC_DRIVER:net.sf.log4jdbc.sql.jdbcapi.DriverSpy}
jdbc.url=${JDBC_URL:jdbc:log4jdbc:mysql://localhost:3307/kkobi?allowPublicKeyRetrieval=true&sslMode=DISABLED&serverTimezone=Asia/Seoul}
jdbc.username=${JDBC_USERNAME:kkobi}
jdbc.password=${JDBC_PASSWORD}
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:kkobi}
jwt.access-token-validity-ms=${JWT_ACCESS_TOKEN_VALIDITY_MS:1800000}
jwt.refresh-token-validity-ms=${JWT_REFRESH_TOKEN_VALIDITY_MS:1209600000}
jwt.refresh-token-cookie-secure=${REFRESH_TOKEN_COOKIE_SECURE:true}
jwt.refresh-token-cookie-same-site=${REFRESH_TOKEN_COOKIE_SAME_SITE:Strict}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173}
redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
event.admin.key=${EVENT_ADMIN_KEY:}
